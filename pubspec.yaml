name: luma
description: Space Social — red social de publicaciones.
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  image_picker: ^1.1.2
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  supabase_flutter: ^2.9.1
  google_sign_in: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/logo.png
    - assets/brand/logo_192.png
  fonts:
    - family: GrandHotel
      fonts:
        - asset: assets/fonts/GrandHotel-Regular.ttf
