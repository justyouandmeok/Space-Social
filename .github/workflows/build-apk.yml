name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-stable-pub
          pub-cache-key: pub-${{ hashFiles('pubspec.lock') }}

      - name: Cache Gradle + Android
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
            android/.gradle
          key: gradle-inc-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: |
            gradle-inc-${{ hashFiles('pubspec.lock') }}-
            gradle-inc-

      - name: Pub get
        run: flutter pub get --enforce-lockfile || flutter pub get

      - name: Build APK (arm64, reuse cache)
        run: flutter build apk --release --target-platform android-arm64 --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: SpaceSocial-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
